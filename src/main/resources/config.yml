# ----------------------------------------------------------------#
#                   Configuration de SHIsValues                   #
# ----------------------------------------------------------------#
#
# Menu des valeurs de blocs de SuperiorSkyblock2 (lues dans block-values/levels.yml) et liste des joueurs ayant des
# permissions particulières sur l'île. Les textes sont dans messages.yml.
#
# Commandes :
#   /shisvalues values   Ouvre le menu des valeurs (alias /shiv ; joueurs seulement).
#   /shisvalues value    Ouvre le menu à la page de l'objet tenu en main (joueurs seulement).
#   /shisvalues reload   Recharge config.yml, messages.yml, les valeurs de SuperiorSkyblock2 et les noms des
#                        permissions d'île. Un fichier invalide annule le rechargement.
#
# Sous-commandes de /is gérées par le plugin (SuperiorSkyblock2 traite /is normalement pour qui n'a pas le droit) :
#   /is values   Même menu que /shisvalues values.
#   /is value    Même menu que /shisvalues value.
#   /is acces    Liste des joueurs ayant des permissions particulières sur votre île.
#
# Permissions :
#   shisvalues.values          /shisvalues values (op par défaut).
#   shisvalues.value           /shisvalues value (op par défaut).
#   shisvalues.is.values       /is values (op par défaut).
#   shisvalues.is.value        /is value (op par défaut).
#   shisvalues.is.acces        /is acces (tout le monde par défaut).
#   shisvalues.admin           Toutes les commandes d'administration (op par défaut).
#   shisvalues.admin.reload    /shisvalues reload

gui:
  title: "&8&lMenu &8| Valeurs (%page%/%max_pages%)"
  rows: 6 # Nombre de rangées

  # Slots spécifiques pour les items de valeur.
  # La taille de cette liste détermine le nombre d'items de valeur par page.
  # Si cette liste est vide, les items de valeur rempliront les slots disponibles
  # non occupés par les items définis dans 'gui.items'.
  value_item_slots: [
    11,12,13,14,15,
    20,21,22,23,24,
    29,30,31,32,33
    # Ajoutez autant de slots que vous voulez par page pour les items de valeur
  ]

  # Définition des items statiques (fillers, boutons, décorations)
  # Chaque clé est un identifiant unique pour l'item.
  # Ces items sont placés sur TOUTES les pages.
  items:
    previous_button:
      enabled: true
      material: "ARROW"
      name: "&c⤾ Page précédente &7(Clic)"
      lore: []
      slots: [48] # Peut être une liste, mais pour un bouton, c'est souvent un seul slot
      action: "PREVIOUS_PAGE" # Action spéciale pour ce bouton
    next_button:
      enabled: true
      material: "ARROW"
      name: "&a⤿ Page suivante &7(Clic)"
      lore: []
      slots: [50]
      action: "NEXT_PAGE" # Action spéciale
    top_border:
      enabled: true
      material: "BLACK_STAINED_GLASS_PANE"
      name: " " # Nom vide pour un filler
      lore: []
      slots: [0,1,2,3,4,5,6,7,8,38,39,40,41,42,45,46,47,49,51,52,53] # Remplir toute la première ligne
    side_borders:
      enabled: true
      material: "GRAY_STAINED_GLASS_PANE"
      name: " "
      lore: []
      slots: [9,10,16,17,18,19,25,26,27,28,34,35,36,37,43,44] # Slots pour les bordures latérales


  # Configuration pour les items représentant les valeurs des blocs
  block_value_item:
    amount: "%superior_island_count_{material_id}%"
    lore:
      - "&fCe bloc vaut &e%value% &fniveaux d'île"
      - ""
      - "&f• &7Quantité: &f%superior_island_count_{material_id}%x"
      - ""

# Fichier des valeurs de blocs de SuperiorSkyblock2, relatif à la racine du serveur.
superior_skyblock_values_path: "plugins/SuperiorSkyblock2/block-values/levels.yml"
